apiVersion: apps/v1
kind: Deployment

metadata:
  name: astra-xdr
  namespace: astra

spec:
  replicas: 1

  selector:
    matchLabels:
      app: astra-xdr

  template:
    metadata:
      labels:
        app: astra-xdr

    spec:
      serviceAccountName: astra-sa

      containers:
      - name: astra-xdr
        image: mrrobot7781/astra-xdr:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
