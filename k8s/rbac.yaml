apiVersion: v1
kind: ServiceAccount
metadata:
  name: astra-sa
  namespace: astra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: astra-role

rules:

# Core Kubernetes Resources
- apiGroups: [""]
  resources:
    - pods
    - nodes
    - namespaces
    - services
    - endpoints
    - events
  verbs:
    - get
    - list
    - watch

# Workloads
- apiGroups: ["apps"]
  resources:
    - deployments
    - replicasets
    - daemonsets
    - statefulsets
  verbs:
    - get
    - list
    - watch

# Jobs
- apiGroups: ["batch"]
  resources:
    - jobs
    - cronjobs
  verbs:
    - get
    - list
    - watch

# Metrics Server (THIS FIXES YOUR ISSUE)
- apiGroups: ["metrics.k8s.io"]
  resources:
    - nodes
    - pods
  verbs:
    - get
    - list
    - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: astra-rolebinding

subjects:
- kind: ServiceAccount
  name: astra-sa
  namespace: astra

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: astra-role
