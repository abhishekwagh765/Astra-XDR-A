<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASTRA-XDR Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">
            🛡 ASTRA-XDR v2
        </span>

        <span class="badge bg-success px-3 py-2">
            {{ cluster.status }}
        </span>
    </div>
</nav>

<div class="container-fluid mt-4">

    <div class="row g-3">

        <div class="col-lg-2 col-md-4">

            <div class="metric-card">

                <h6>CPU</h6>

                <h2 id="cpuValue">0</h2>

                <small>millicores</small>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="metric-card">

                <h6>Memory</h6>

                <h2 id="memoryValue">0</h2>

                <small>MiB</small>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="metric-card">

                <h6>Nodes</h6>

                <h2>{{ cluster.nodes }}</h2>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="metric-card">

                <h6>Pods</h6>

                <h2>{{ cluster.pods }}</h2>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="metric-card">

                <h6>Alerts</h6>

                <h2 id="alertCount">0</h2>

            </div>

        </div>

        <div class="col-lg-2 col-md-4">

            <div class="metric-card">

                <h6>Namespaces</h6>

                <h2>{{ cluster.namespaces }}</h2>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-lg-6">

            <div class="chart-card">

                <h5>CPU Usage</h5>

                <canvas id="cpuChart"></canvas>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="chart-card">

                <h5>Memory Usage</h5>

                <canvas id="memoryChart"></canvas>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-lg-6">

            <div class="table-card">

                <h5>🔥 Top CPU Pods</h5>

                <table class="table table-dark table-hover">

                    <thead>

                        <tr>

                            <th>Pod</th>
                            <th>CPU</th>

                        </tr>

                    </thead>

                    <tbody id="cpuPods">

                    </tbody>

                </table>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="table-card">

                <h5>💾 Top Memory Pods</h5>

                <table class="table table-dark table-hover">

                    <thead>

                        <tr>

                            <th>Pod</th>
                            <th>Memory</th>

                        </tr>

                    </thead>

                    <tbody id="memoryPods">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="row mt-4">

        <div class="col-lg-12">

            <div class="table-card">

                <h5>🚨 Live Falco Alerts</h5>

                <div id="falcoAlerts"></div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>

</html>
