{% extends "base.html" %}
{% block title %}Page Not Found | ASTRA-XDR{% endblock %}

{% block content %}
<section class="page-hero not-found-section">
  <div class="container text-center">
    <span class="eyebrow-tag reveal-up">404</span>
    <h1 class="page-title reveal-up delay-1">This route wasn't detected.</h1>
    <p class="page-lead reveal-up delay-2">
      The page you're looking for doesn't exist. Let's get you back to a known-good state.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary-glow reveal-up delay-3">
      <i class="fa-solid fa-house me-2"></i>Back to Home
    </a>
  </div>
</section>
{% endblock %}
