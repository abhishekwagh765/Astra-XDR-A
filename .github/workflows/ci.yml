name: ASTRA-XDR CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # STAGE 1: STATIC APPLICATION SECURITY TESTING (SAST)
  # ==========================================
  sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Run Semgrep Security Scan
        run: |
          semgrep --config=p/security-audit --error app/

  # ==========================================
  # STAGE 2: BUILD DOCKER IMAGE & CONTAINER SECURITY
  # ==========================================
  container-security:
    name: Docker Build & Trivy Scan
    needs: sast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t astra-xdr:latest ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: astra-xdr:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ==========================================
  # STAGE 3: PUSH IMAGE TO DOCKER HUB
  # ==========================================
  push-to-dockerhub:
    name: Push Image to Docker Hub
    needs: container-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t astra-xdr:latest ./app

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag astra-xdr:latest ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr:latest
