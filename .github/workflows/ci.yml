name: ASTRA-XDR CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # JOB 1 - STATIC APPLICATION SECURITY TESTING
  # ==========================================
  sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep --config=p/owasp-top-ten app/

  # ==========================================
  # JOB 2 - BUILD & CONTAINER SECURITY
  # ==========================================
  container-security:
    name: Docker Build & Trivy Scan
    needs: sast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t astra-xdr:v1 ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "astra-xdr:v1"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # ==========================================
  # JOB 3 - PUSH TO AMAZON ECR (NEXT PHASE)
  # ==========================================
  push-to-ecr:
    name: Push Docker Image to Amazon ECR
    needs: container-security
    runs-on: ubuntu-latest

    steps:
      - name: Placeholder
        run: |
          echo "Amazon ECR integration will be added in the next phase."
