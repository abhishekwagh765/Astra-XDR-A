name: ASTRA-XDR CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # STAGE 1: CODE QUALITY & SECURITY (SONARCLOUD)
  # ==========================================
  sonarcloud:
    name: Code Quality & Security Scan (SAST)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================
  # STAGE 2: BUILD DOCKER IMAGE & TRIVY SCAN
  # ==========================================
  container-security:
    name: Docker Build & Trivy Scan
    needs: sonarcloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t astra-xdr:latest ./app

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: astra-xdr:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ==========================================
  # STAGE 3: PUSH IMAGE TO DOCKER HUB
  # ==========================================
  push-to-dockerhub:
    name: Push Image to Docker Hub
    needs: container-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t astra-xdr:latest ./app

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag astra-xdr:latest ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/astra-xdr:latest

  # ==========================================
  # STAGE 4: DEPLOY TO KUBERNETES
  # ==========================================
  kubernetes-deploy:
    name: Deploy to Kubernetes
    needs: push-to-dockerhub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Verify Cluster Connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Kubernetes Resources
        run: |
          kubectl apply -f k8s/

      - name: Restart Astra-XDR Deployment
        run: |
          kubectl rollout restart deployment/astra-xdr -n astra

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/astra-xdr -n astra --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get pods -n astra
          kubectl get svc -n astra
